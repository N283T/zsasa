name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "python/README.md"
      - "python/examples/README.md"
      - "examples/README.md"
      - ".github/workflows/docs.yml"
      # Besides the site, this workflow builds the Zig autodoc (`zig build docs`,
      # from src/ and build.zig) and the Python autodoc (`pip install -e .` builds
      # the Zig library, then pdoc imports the zsasa package), and website/build.py
      # reads the version from build.zig.zon. A change to any of them can break the
      # job, so check it on the pull request instead of after the merge.
      - "src/**"
      - "build.zig"
      - "build.zig.zon"
      - "python/pyproject.toml"
      - "python/hatch_build.py"
      - "python/zsasa/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Build site
        run: uv run website/build.py

      - name: Build Zig autodoc
        run: zig build docs

      - name: Build Python autodoc
        working-directory: python
        run: |
          pip install "pdoc>=14.0"
          pip install -e .
          pdoc zsasa --output-dir /tmp/python-autodoc

      - name: Copy Zig autodoc into site
        if: github.event_name != 'pull_request'
        run: cp -r zig-out/docs website/dist/zig-autodoc

      - name: Copy Python autodoc into site
        if: github.event_name != 'pull_request'
        run: cp -r /tmp/python-autodoc website/dist/python-autodoc

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
