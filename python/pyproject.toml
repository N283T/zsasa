[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zsasa"
version = "0.9.1"
description = "Fast SASA calculation using Zig"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tsubasa Nagae" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=1.24", "cffi>=1.15"]

[project.optional-dependencies]
biopython = ["biopython>=1.80"]
biotite = ["biotite>=1.0.0"]
gemmi = ["gemmi>=0.6.0"]
mdtraj = ["mdtraj>=1.9.0"]
mdanalysis = ["MDAnalysis>=2.0.0"]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "ruff>=0.5", "ty>=0.0.1a0", "pdoc>=14.0"]
all = [
    "zsasa[biopython]",
    "zsasa[biotite]",
    "zsasa[gemmi]",
    "zsasa[mdtraj]",
    "zsasa[mdanalysis]",
]

[project.scripts]
zsasa = "zsasa.cli:main"

[project.urls]
Homepage = "https://n283t.github.io/zsasa/"
Repository = "https://github.com/N283T/zsasa"
Documentation = "https://n283t.github.io/zsasa/"
Issues = "https://github.com/N283T/zsasa/issues"
Changelog = "https://github.com/N283T/zsasa/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["zsasa"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "hatch_build.py",
    "pyproject.toml",
    "zsasa/**",
]

[tool.hatch.build.targets.sdist.force-include]
"../build.zig" = "build.zig"
"../build.zig.zon" = "build.zig.zon"
"../src" = "src"
"../LICENSE" = "LICENSE"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ty.environment]
python-version = "3.11"

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*"]
skip = ["*-win32", "*-win_arm64", "*-musllinux_*", "*_s390x", "*_ppc64le"]
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/python/tests/test_sasa.py {project}/python/tests/test_cli.py -x -q"

[tool.cibuildwheel.linux]
# Use manylinux_2_28 (glibc 2.28) containers to match Zig glibc target.
# Default manylinux2014 (glibc 2.17) is too old for our glibc 2.28 target.
# Pin to an explicit quay.io tag because the short alias resolves to a
# tag baked into cibuildwheel that has been retired upstream
# (e.g. 2026.03.01-1 disappeared from quay.io and broke v0.2.10's wheel build).
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64:2026.04.25-0"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64:2026.04.25-0"
# Download Zig directly from official release (avoids PyPI rate limits).
# ARCH resolves to x86_64 or aarch64 depending on the runner. The tarball is
# checked against the sha256 published in https://ziglang.org/download/index.json
# for 0.16.0 before it is unpacked; the build stops on a mismatch. When bumping
# Zig, update both checksums here and in the Dockerfile.
# x86-64 wheels are built for x86_64_v3 (AVX2, FMA) and aarch64 for the baseline;
# the CLI binaries and the Docker image use the same CPUs (publish.yml, Dockerfile).
before-all = 'ARCH=$(uname -m) && case $ARCH in x86_64) SHA=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00; CPU=x86_64_v3;; aarch64) SHA=ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17; CPU=baseline;; *) echo "unsupported architecture $ARCH" >&2; exit 1;; esac && curl -sSfL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-$ARCH-linux-0.16.0.tar.xz && test "$(sha256sum /tmp/zig.tar.xz | cut -d" " -f1)" = "$SHA" && tar -xJf /tmp/zig.tar.xz -C /usr/local && ln -sf /usr/local/zig-$ARCH-linux-0.16.0/zig /usr/local/bin/zig && zig build -Doptimize=ReleaseFast -Dtarget=$ARCH-linux-gnu.2.28 -Dcpu=$CPU'

[tool.cibuildwheel.macos]
# Zig installed by setup-zig action in workflow (not via PyPI).
# The explicit target sets the minimum macOS version to 11.0, matching the
# macosx_11_0 wheel tag: Zig ignores MACOSX_DEPLOYMENT_TARGET and would otherwise
# use the build host's version. Intel wheels are built for x86_64_v3 (AVX2, FMA).
before-all = 'ARCH=$(uname -m) && case $ARCH in x86_64) ZIG_ARGS="-Dtarget=x86_64-macos.11.0 -Dcpu=x86_64_v3";; arm64) ZIG_ARGS="-Dtarget=aarch64-macos.11.0";; *) echo "unsupported architecture $ARCH" >&2; exit 1;; esac && zig build -Doptimize=ReleaseFast $ZIG_ARGS'
# Skip delocate: libzsasa.dylib has no external dylib dependencies.
repair-wheel-command = ""

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.cibuildwheel.windows]
# Zig installed by setup-zig action in workflow (not via PyPI).
# Built for x86_64_v3 (AVX2, FMA), not for the CPU of the build machine.
before-all = "zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v3"
# Skip delvewheel: Zig statically links everything, no external DLL dependencies.
repair-wheel-command = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
